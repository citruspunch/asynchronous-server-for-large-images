<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltraTile Viewer</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
<h1>UltraTile</h1>
<label for="image">Image</label>
<select id="image"></select>
<span id="hud">
<span>rxBytes <b id="rxBytes">0</b></span>
<span>decodedBytes <b id="decodedBytes">0</b></span>
<span>epoch <b id="epoch">0</b></span>
<span>netCov <b id="netCov">0%</b></span>
<span>covCov <b id="covCov">0%</b></span>
</span>
</header>
<main>
<canvas id="canvas"></canvas>
</main>
<script src="/viewer.js"></script>
</body>
</html>
